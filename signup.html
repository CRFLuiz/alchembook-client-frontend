<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - AlchemBook</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="signup-bg">
    <div class="login-container">
        <div class="login-box">
            <h2>Cadastro</h2>
            <form id="signupForm">
                <div class="input-group">
                    <label for="username">Nome de usuário</label>
                    <input type="text" id="username" name="username" placeholder="Digite seu nome de usuário" required>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu email" required>
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Crie uma senha" required>
                </div>
                <div class="input-group">
                    <label for="confirmPassword">Confirmar Senha</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirme sua senha" required>
                </div>
                <button type="submit" class="login-btn">Cadastrar</button>
            </form>
            <div class="footer-links">
                <a href="login.html">Já tem uma conta? Faça login</a>
            </div>
        </div>
    </div>
    <script src="js/scripts.js"></script>
</body>
</html>
