<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <header>
            <h2>Dra. Laura Mendes - Chief Creative Officer (CCO)</h2>
        </header>
        <div id="chat-box" class="chat-box">
            <!-- Mensagens serão renderizadas aqui -->
            <div class="message user">Olá! Como posso ajudar hoje?</div>
        </div>
        <form id="message-form">
            <input type="text" id="message-input" placeholder="Digite sua mensagem..." required>
            <button type="submit">Enviar</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
